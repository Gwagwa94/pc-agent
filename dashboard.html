<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PC Agent — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d2e; --border: #2d3148;
      --accent: #6366f1; --accent-h: #4f46e5;
      --text: #e2e8f0; --muted: #64748b; --ok: #22c55e; --err: #ef4444; --warn: #f59e0b;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ── */
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0.65rem 1.25rem; display: flex; align-items: center; gap: 0.85rem; flex-shrink: 0; flex-wrap: wrap;
    }
    header h1 { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .status-dot.online  { background: var(--ok);  box-shadow: 0 0 6px var(--ok);  }
    .status-dot.busy    { background: var(--warn); box-shadow: 0 0 6px var(--warn); animation: pulse 1s infinite; }
    .status-dot.offline { background: var(--err);  box-shadow: 0 0 6px var(--err); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    #status-label { font-size: 0.8rem; color: var(--muted); }
    #screen-dims  { font-size: 0.75rem; color: var(--muted); background: var(--bg); padding: 0.2rem 0.45rem; border-radius: 4px; border: 1px solid var(--border); }

    /* Model Picker in Header */
    .model-picker-wrap {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--bg); border: 1px solid var(--border);
      padding: 0.25rem 0.65rem; border-radius: 8px; font-size: 0.8rem; margin-left: auto;
    }
    .model-picker-wrap label { color: var(--muted); font-weight: 600; white-space: nowrap; }
    #model-select {
      background: transparent; color: var(--text); border: none; outline: none;
      font-size: 0.82rem; cursor: pointer; font-weight: 600; max-width: 280px;
    }
    #model-select option { background: var(--surface); color: var(--text); }

    .btn-logout {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 0.35rem 0.75rem; cursor: pointer; font-size: 0.8rem;
    }
    .btn-logout:hover { border-color: var(--err); color: var(--err); }

    /* ── Main layout ── */
    .main { flex: 1; display: grid; grid-template-columns: 1fr 340px; overflow: hidden; }

    /* ── Left: chat + command ── */
    .left-pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
    #chat {
      flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.85rem;
    }
    .msg { max-width: 85%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.92rem; line-height: 1.5; word-break: break-word; }
    .msg.user   { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
    .msg.agent  { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .msg.system { align-self: center; background: none; color: var(--muted); font-size: 0.8rem; border: none; padding: 0.25rem 0; }
    .msg.error  { align-self: flex-start; background: #2d1515; border: 1px solid #7f1d1d; color: #fca5a5; }

    /* Shortcuts bar */
    .shortcuts {
      padding: 0.6rem 1.25rem; border-top: 1px solid var(--border);
      display: flex; gap: 0.5rem; flex-wrap: wrap; background: rgba(26, 29, 46, 0.4);
    }
    .shortcut-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 0.35rem 0.75rem;
      font-size: 0.78rem; cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .shortcut-btn:hover { border-color: var(--accent); background: #23273e; }

    /* Input area - Grande, confortable et sans espace initial */
    .input-area {
      padding: 1rem 1.25rem; border-top: 1px solid var(--border);
      display: flex; gap: 0.75rem; background: var(--surface); align-items: flex-end;
    }
    #instruction {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 0.85rem 1rem;
      font-size: 1rem; line-height: 1.45; outline: none; resize: none;
      min-height: 58px; max-height: 180px; cursor: text;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #instruction:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }
    #send-btn {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      min-height: 58px; padding: 0.85rem 1.5rem; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s, transform 0.1s; white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-h); }
    #send-btn:active:not(:disabled) { transform: scale(0.98); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Right: snapshot + logs ── */
    .right-pane { display: flex; flex-direction: column; overflow: hidden; background: #131622; }
    .pane-title {
      font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.08em; padding: 0.65rem 1rem; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .btn-refresh {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: 4px; padding: 0.18rem 0.55rem; font-size: 0.72rem; cursor: pointer; transition: all 0.2s;
    }
    .btn-refresh:hover { border-color: var(--accent); color: var(--text); background: var(--surface); }

    #snapshot-wrap {
      flex-shrink: 0; border-bottom: 1px solid var(--border);
      background: #000; display: flex; align-items: center; justify-content: center;
      height: 210px; overflow: hidden; position: relative;
    }
    #snapshot-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
    #snap-time { font-size: 0.72rem; color: var(--muted); padding: 0.35rem 1rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }

    #logs {
      flex: 1; overflow-y: auto; padding: 0.6rem 0.85rem;
      font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 0.74rem;
      line-height: 1.6; color: #94a3b8;
    }
    #logs .log-line { padding: 0.08rem 0; }
    #logs .log-line.ok   { color: var(--ok);   }
    #logs .log-line.err  { color: var(--err);  }
    #logs .log-line.warn { color: var(--warn); }
    #logs .log-line.info { color: #818cf8; }

    /* ── Snapshot modal ── */
    #snap-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88);
      z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out;
    }
    #snap-modal.open { display: flex; }
    #snap-modal img { max-width: 95vw; max-height: 95vh; border-radius: 8px; box-shadow: 0 0 24px rgba(0,0,0,0.8); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid #ffffff44;
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 820px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .right-pane { border-right: none; border-top: 1px solid var(--border); max-height: 280px; }
      .model-picker-wrap { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <span class="status-dot" id="status-dot"></span>
  <h1>🤖 PC Agent <small style="font-weight:400;color:var(--muted)">Dual-Brain</small></h1>
  <span id="status-label">–</span>
  <span id="screen-dims"></span>

  <div class="model-picker-wrap">
    <label for="model-select">🧠 Stratège :</label>
    <select id="model-select" onchange="changeModel(this.value)" title="Choisir le modèle de réflexion et planification">
      <option value="ui-tars-1.5-7b">UI-TARS 7B (100% VRAM / 0 Swap)</option>
      <option value="qwen/qwen3.5-9b">Qwen 3.5 9B (100% VRAM)</option>
      <option value="qwen3.5-9b-claude-4.6-highiq-instruct-heretic-uncensored">Qwen 3.5 9B Claude (100% VRAM)</option>
      <option value="google/gemma-4-26b-a4b-qat">Gemma 4 26B-A4B (MoE Hybride)</option>
    </select>
  </div>

  <form action="/logout" method="POST" style="margin-left:0.5rem">
    <button class="btn-logout" type="submit">Déconnexion</button>
  </form>
</header>

<div class="main">

  <!-- ── Left: Chat ── -->
  <div class="left-pane">
    <div id="chat">
      <div class="msg system">Interface connectée au PC Agent. Prêt pour tes ordres en langage naturel.</div>
    </div>

    <div class="shortcuts">
      <span style="font-size:0.75rem;color:var(--muted);align-self:center">Raccourcis :</span>
      <button class="shortcut-btn" onclick="sendQuick('Prends une capture d\'écran et décris ce que tu vois')">📸 Snapshot</button>
      <button class="shortcut-btn" onclick="sendQuick('Ouvre Gmail dans Chrome')">📧 Gmail</button>
      <button class="shortcut-btn" onclick="sendQuick('Ouvre une nouvelle fenêtre Chrome')">🌐 Chrome</button>
      <button class="shortcut-btn" onclick="sendQuick('Dis-moi quelle application est au premier plan')">🪟 Fenêtre active</button>
    </div>

    <div class="input-area">
      <textarea id="instruction" placeholder="Tape ton ordre ici (ex : Ouvre Chrome, écris un mail, vérifie l'écran...)" rows="2"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,180)+'px'"></textarea>
      <button id="send-btn" onclick="send()">Envoyer</button>
    </div>
  </div>

  <!-- ── Right: Snapshot + Logs ── -->
  <div class="right-pane">
    <div class="pane-title">
      <span>Écran en direct</span>
      <button class="btn-refresh" onclick="refreshSnapshotManual()" title="Rafraîchir manuellement la capture">🔄 Rafraîchir</button>
    </div>
    <div id="snapshot-wrap">
      <img id="snapshot-img" src="" alt="Snapshot" style="display:none" onclick="openSnap()">
    </div>
    <div id="snap-time">Aucune capture récente</div>

    <div class="pane-title" style="border-top:1px solid var(--border)">Logs d'activité</div>
    <div id="logs"></div>
  </div>
</div>

<!-- Snapshot modal -->
<div id="snap-modal" onclick="closeSnap()">
  <img id="snap-modal-img" src="" alt="Plein écran">
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let busy = false;
  let seenLogs = 0;
  let lastKnownSnapshotTime = 0;

  // ── Model Selection ────────────────────────────────────────────────────────
  async function loadModels() {
    try {
      const res = await fetch('/api/models');
      if (!res.ok) return;
      const data = await res.json();
      const select = document.getElementById('model-select');
      if (data.models && Array.isArray(data.models) && data.models.length > 0) {
        select.innerHTML = '';
        for (const m of data.models) {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          if (data.currentPlanner && m.id.toLowerCase().includes(data.currentPlanner.toLowerCase())) {
            opt.selected = true;
          }
          select.appendChild(opt);
        }
      }
    } catch {
      // conservation des options par défaut
    }
  }

  async function changeModel(newModel) {
    try {
      const res = await fetch('/api/model', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plannerModel: newModel }),
      });
      if (res.ok) {
        addChatMsg(`⚙️ Modèle Stratège configuré sur : <b>${newModel}</b>`, 'system');
      }
    } catch (e) {
      addChatMsg(`❌ Impossible de changer de modèle : ${e.message}`, 'error');
    }
  }

  // ── Polling intelligent (sans spam de requêtes d'images) ───────────────────
  async function pollStatus() {
    try {
      const res = await fetch('/api/status');
      if (res.status === 401) { location.href = '/login'; return; }
      const data = await res.json();
      updateStatus(data);
    } catch {
      setOffline();
    }
  }

  function updateStatus(data) {
    const dot = document.getElementById('status-dot');
    const lbl = document.getElementById('status-label');
    const dims = document.getElementById('screen-dims');

    busy = data.busy;
    dot.className = 'status-dot ' + (data.busy ? 'busy' : 'online');
    lbl.textContent = data.busy ? '⚙️ En cours…' : '✅ En attente';
    if (data.screenDimensions)
      dims.textContent = `${data.screenDimensions.width}×${data.screenDimensions.height}`;

    // Logs (avec filtrage des pings status)
    if (data.logs && data.logs.length > seenLogs) {
      const newLines = data.logs.slice(seenLogs);
      seenLogs = data.logs.length;
      appendLogs(newLines);
    }

    // Snapshot : UNIQUEMENT si un nouveau snapshot a été généré
    if (data.hasSnapshot && data.snapshotTime && data.snapshotTime > lastKnownSnapshotTime) {
      lastKnownSnapshotTime = data.snapshotTime;
      renderSnapshot(data.snapshotTime);
    }

    setSendDisabled(data.busy);
  }

  function renderSnapshot(ts) {
    const src = `/api/snapshot.png?t=${ts || Date.now()}`;
    const img = document.getElementById('snapshot-img');
    img.src = src;
    img.style.display = '';
    document.getElementById('snap-modal-img').src = src;
    const d = new Date(ts || Date.now());
    document.getElementById('snap-time').textContent = `Capturé à ${d.toLocaleTimeString('fr-FR')}`;
  }

  function refreshSnapshotManual() {
    renderSnapshot(Date.now());
  }

  function setOffline() {
    document.getElementById('status-dot').className = 'status-dot offline';
    document.getElementById('status-label').textContent = '❌ Agent hors ligne';
  }

  // ── Logs rendering ────────────────────────────────────────────────────────
  function appendLogs(lines) {
    const container = document.getElementById('logs');
    for (const line of lines) {
      // Ignorer les pings de statut silencieux pour ne pas polluer l'affichage
      if (/\/status/i.test(line)) continue;

      const div = document.createElement('div');
      div.className = 'log-line ' + classifyLog(line);
      div.textContent = line;
      container.appendChild(div);
    }
    container.scrollTop = container.scrollHeight;
  }

  function classifyLog(line) {
    if (/✅|PRÊT|DONE/i.test(line)) return 'ok';
    if (/❌|Erreur|ERROR|FAILED/i.test(line)) return 'err';
    if (/⚠️|SWAP|VRAM|MODÈLE/i.test(line)) return 'warn';
    if (/🧠|🛠️|📩|CYCLE|Stratège|Exécutant|720p/i.test(line)) return 'info';
    return '';
  }

  // ── Send command ──────────────────────────────────────────────────────────
  async function send() {
    const textarea = document.getElementById('instruction');
    const instruction = textarea.value.trim();
    if (!instruction || busy) return;

    addChatMsg(instruction, 'user');
    textarea.value = '';
    textarea.style.height = 'auto';
    setSendDisabled(true);

    const thinkingDiv = addChatMsg('<span class="spinner"></span>Réflexion & exécution en cours…', 'agent');

    try {
      const res = await fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ instruction }),
      });
      if (res.status === 401) { location.href = '/login'; return; }

      const data = await res.json();
      thinkingDiv.remove();
      if (res.ok) {
        addChatMsg(data.result || '✅ Terminé.', 'agent');
        refreshSnapshotManual();
      } else {
        addChatMsg('❌ ' + (data.error || 'Erreur inconnue'), 'error');
      }
    } catch (err) {
      thinkingDiv.remove();
      addChatMsg('❌ Réseau : ' + err.message, 'error');
    } finally {
      setSendDisabled(false);
      pollStatus();
    }
  }

  function sendQuick(text) {
    const textarea = document.getElementById('instruction');
    textarea.value = text;
    send();
  }

  // ── Chat helpers ──────────────────────────────────────────────────────────
  function addChatMsg(html, type) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function setSendDisabled(val) {
    const btn = document.getElementById('send-btn');
    btn.disabled = val;
    btn.textContent = val ? 'En cours…' : 'Envoyer';
  }

  // ── Snapshot modal ──
  function openSnap() {
    document.getElementById('snap-modal').classList.add('open');
  }
  function closeSnap() {
    document.getElementById('snap-modal').classList.remove('open');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSnap(); });

  // ── Dynamic loop (interval adapté) ─────────────────────────────────────────
  async function runPollingLoop() {
    await pollStatus();
    // Quand l'agent est occupé, on surveille plus activement (1500ms), sinon calmement (4000ms)
    setTimeout(runPollingLoop, busy ? 1500 : 4000);
  }

  loadModels();
  runPollingLoop();
</script>
</body>
</html>
