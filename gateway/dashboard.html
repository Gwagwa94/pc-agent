<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PC Agent — Dual-Brain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0d13;
      --sidebar-bg: #111420;
      --surface: #181c2d;
      --surface-hover: #22273e;
      --border: #262c45;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f1f5f9;
      --muted: #64748b;
      --ok: #22c55e;
      --err: #ef4444;
      --warn: #f59e0b;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-logo {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .status-dot.online  { background: var(--ok);  box-shadow: 0 0 6px var(--ok); }
    .status-dot.busy    { background: var(--warn); box-shadow: 0 0 6px var(--warn); animation: pulse 1s infinite; }
    .status-dot.offline { background: var(--err);  box-shadow: 0 0 6px var(--err); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    #status-label { font-size: 0.8rem; color: var(--muted); }
    #screen-dims  { font-size: 0.75rem; color: var(--muted); background: var(--bg); padding: 0.2rem 0.45rem; border-radius: 4px; border: 1px solid var(--border); }

    /* Model Picker in Header */
    .model-picker-wrap {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--bg); border: 1px solid var(--border);
      padding: 0.25rem 0.65rem; border-radius: 8px; font-size: 0.8rem; margin-left: auto;
    }
    .model-picker-wrap label { color: var(--muted); font-weight: 600; white-space: nowrap; }
    #model-select {
      background: transparent; color: var(--text); border: none; outline: none;
      font-size: 0.82rem; cursor: pointer; font-weight: 600; max-width: 260px;
    }
    #model-select option { background: var(--surface); color: var(--text); }

    .header-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 0.35rem 0.75rem; cursor: pointer; font-size: 0.8rem;
      transition: all 0.2s;
    }
    .header-btn:hover { border-color: var(--text); color: var(--text); }
    .header-btn.danger:hover { border-color: var(--err); color: var(--err); }

    /* ── Main Layout: Sidebar + Chat + Right Panel ── */
    .app-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 260px 1fr 340px;
      overflow: hidden;
      position: relative;
    }

    /* ── Left Sidebar (ChatGPT / Gemini style) ── */
    .sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .new-chat-wrap {
      padding: 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .btn-new-chat {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-new-chat:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .conv-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.86rem;
      color: #94a3b8;
      border: 1px solid transparent;
      transition: background 0.15s, color 0.15s;
    }
    .conv-item:hover {
      background: var(--surface);
      color: var(--text);
    }
    .conv-item.active {
      background: var(--surface-hover);
      color: #fff;
      border-color: var(--border);
      font-weight: 600;
    }
    .conv-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .btn-delete-conv {
      opacity: 0;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: opacity 0.2s, color 0.2s;
    }
    .conv-item:hover .btn-delete-conv {
      opacity: 1;
    }
    .btn-delete-conv:hover {
      color: var(--err);
    }

    /* ── Center Chat Panel ── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .chat-header {
      padding: 0.65rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: rgba(24, 28, 45, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-folder-badge {
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--surface);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg {
      max-width: 82%;
      padding: 0.8rem 1.1rem;
      border-radius: 12px;
      font-size: 0.93rem;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.user   { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
    .msg.agent  { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .msg.system { align-self: center; background: none; color: var(--muted); font-size: 0.8rem; border: none; padding: 0.25rem 0; }
    .msg.error  { align-self: flex-start; background: #2d1515; border: 1px solid #7f1d1d; color: #fca5a5; }

    /* Shortcuts bar */
    .shortcuts {
      padding: 0.6rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      background: rgba(24, 28, 45, 0.4);
    }
    .shortcut-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.78rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .shortcut-btn:hover { border-color: var(--accent); background: var(--surface-hover); }

    /* Input area - Grande, confortable et sans espace initial */
    .input-area {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      background: var(--surface);
      align-items: flex-end;
    }
    #instruction {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      line-height: 1.45;
      outline: none;
      resize: none;
      min-height: 58px;
      max-height: 180px;
      cursor: text;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #instruction:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }
    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      min-height: 58px;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:active:not(:disabled) { transform: scale(0.98); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Right Panel: Snapshot + Logs ── */
    .right-pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #111420;
    }
    .pane-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .btn-refresh {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 0.18rem 0.55rem;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-refresh:hover { border-color: var(--accent); color: var(--text); background: var(--surface); }

    #snapshot-wrap {
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 210px;
      overflow: hidden;
    }
    #snapshot-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
    #snap-time { font-size: 0.72rem; color: var(--muted); padding: 0.35rem 1rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }

    #logs {
      flex: 1;
      overflow-y: auto;
      padding: 0.6rem 0.85rem;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.74rem;
      line-height: 1.6;
      color: #94a3b8;
    }
    #logs .log-line { padding: 0.08rem 0; }
    #logs .log-line.ok   { color: var(--ok);   }
    #logs .log-line.err  { color: var(--err);  }
    #logs .log-line.warn { color: var(--warn); }
    #logs .log-line.info { color: #818cf8; }

    /* ── Snapshot modal ── */
    #snap-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88);
      z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out;
    }
    #snap-modal.open { display: flex; }
    #snap-modal img { max-width: 95vw; max-height: 95vh; border-radius: 8px; box-shadow: 0 0 24px rgba(0,0,0,0.8); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid #ffffff44;
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 980px) {
      .app-layout { grid-template-columns: 220px 1fr; }
      .right-pane { display: none; }
    }
    @media (max-width: 680px) {
      .app-layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-logo" onclick="startNewConversation()">
    <span class="status-dot" id="status-dot"></span>
    <span>🤖 PC Agent</span>
    <small style="font-weight:400;color:var(--muted)">Dual-Brain</small>
  </div>
  <span id="status-label">–</span>
  <span id="screen-dims"></span>

  <div class="model-picker-wrap">
    <label for="model-select">🧠 Stratège :</label>
    <select id="model-select" onchange="changeModel(this.value)" title="Choisir le modèle de réflexion et planification">
      <option value="ui-tars-1.5-7b">UI-TARS 7B (100% VRAM / 0 Swap)</option>
      <option value="qwen/qwen3.5-9b">Qwen 3.5 9B (100% VRAM)</option>
      <option value="qwen3.5-9b-claude-4.6-highiq-instruct-heretic-uncensored">Qwen 3.5 9B Claude (100% VRAM)</option>
      <option value="google/gemma-4-26b-a4b-qat">Gemma 4 26B-A4B (MoE Hybride)</option>
    </select>
  </div>

  <form action="/logout" method="POST" style="margin-left:0.5rem">
    <button class="header-btn danger" type="submit">Déconnexion</button>
  </form>
</header>

<div class="app-layout">

  <!-- ── Left: Conversations Sidebar ── -->
  <aside class="sidebar">
    <div class="new-chat-wrap">
      <button class="btn-new-chat" onclick="startNewConversation()">
        <span style="font-size:1.1rem;line-height:1">+</span> Nouvelle discussion
      </button>
    </div>
    <div class="conv-list" id="conv-list">
      <!-- Liste dynamique des conversations -->
    </div>
  </aside>

  <!-- ── Center: Main Chat ── -->
  <main class="chat-panel">
    <div class="chat-header">
      <div class="chat-title" id="active-chat-title">Nouvelle discussion</div>
      <div class="chat-folder-badge" id="active-chat-badge">conversations/</div>
    </div>

    <div id="chat">
      <div class="msg system">Discussion prête. Vos échanges, réflexions et actions sont automatiquement indexés et enregistrés dans un dossier dédié.</div>
    </div>

    <div class="shortcuts">
      <span style="font-size:0.75rem;color:var(--muted);align-self:center">Raccourcis :</span>
      <button class="shortcut-btn" onclick="sendQuick('Prends une capture d\'écran et décris ce que tu vois')">📸 Snapshot</button>
      <button class="shortcut-btn" onclick="sendQuick('Ouvre Gmail dans Chrome')">📧 Gmail</button>
      <button class="shortcut-btn" onclick="sendQuick('Ouvre une nouvelle fenêtre Chrome')">🌐 Chrome</button>
      <button class="shortcut-btn" onclick="sendQuick('Dis-moi quelle application est au premier plan')">🪟 Fenêtre active</button>
    </div>

    <div class="input-area">
      <textarea id="instruction" placeholder="Tape ton ordre ici (ex : Ouvre Chrome, écris un mail, vérifie l'écran...)" rows="2"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,180)+'px'"></textarea>
      <button id="send-btn" onclick="send()">Envoyer</button>
    </div>
  </main>

  <!-- ── Right: Snapshot + Logs ── -->
  <aside class="right-pane">
    <div class="pane-title">
      <span>Écran en direct</span>
      <button class="btn-refresh" onclick="refreshSnapshotManual()" title="Rafraîchir manuellement la capture">🔄 Rafraîchir</button>
    </div>
    <div id="snapshot-wrap">
      <img id="snapshot-img" src="" alt="Snapshot" style="display:none" onclick="openSnap()">
    </div>
    <div id="snap-time">Aucune capture récente</div>

    <div class="pane-title" style="border-top:1px solid var(--border)">Logs d'activité</div>
    <div id="logs"></div>
  </aside>
</div>

<!-- Snapshot modal -->
<div id="snap-modal" onclick="closeSnap()">
  <img id="snap-modal-img" src="" alt="Plein écran">
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let busy = false;
  let seenLogs = 0;
  let lastKnownSnapshotTime = 0;
  let currentConversationId = null;

  // ── Model Selection ────────────────────────────────────────────────────────
  async function loadModels() {
    try {
      const res = await fetch('/api/models');
      if (!res.ok) return;
      const data = await res.json();
      const select = document.getElementById('model-select');
      if (data.models && Array.isArray(data.models) && data.models.length > 0) {
        select.innerHTML = '';
        for (const m of data.models) {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          if (data.currentPlanner && m.id.toLowerCase().includes(data.currentPlanner.toLowerCase())) {
            opt.selected = true;
          }
          select.appendChild(opt);
        }
      }
    } catch {
      // conservation des options par défaut
    }
  }

  async function changeModel(newModel) {
    try {
      const res = await fetch('/api/model', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plannerModel: newModel }),
      });
      if (res.ok) {
        addChatMsg(`⚙️ Modèle Stratège configuré sur : <b>${newModel}</b>`, 'system');
      }
    } catch (e) {
      addChatMsg(`❌ Impossible de changer de modèle : ${e.message}`, 'error');
    }
  }

  // ── Conversations Management (ChatGPT / Gemini style) ──────────────────────
  async function loadConversationsList() {
    try {
      const res = await fetch('/api/conversations');
      if (!res.ok) return;
      const data = await res.json();
      const list = data.conversations || [];
      renderConversationsSidebar(list);

      // Si aucune discussion active, on active la plus récente ou on en crée une
      if (!currentConversationId && list.length > 0) {
        selectConversation(list[0].id);
      } else if (!currentConversationId && list.length === 0) {
        startNewConversation();
      }
    } catch {
      // ignore
    }
  }

  function renderConversationsSidebar(list) {
    const container = document.getElementById('conv-list');
    container.innerHTML = '';

    if (list.length === 0) {
      const emptyDiv = document.createElement('div');
      emptyDiv.style.padding = '0.75rem';
      emptyDiv.style.fontSize = '0.8rem';
      emptyDiv.style.color = 'var(--muted)';
      emptyDiv.textContent = 'Aucune discussion.';
      container.appendChild(emptyDiv);
      return;
    }

    for (const conv of list) {
      const item = document.createElement('div');
      item.className = 'conv-item' + (conv.id === currentConversationId ? ' active' : '');
      item.onclick = () => selectConversation(conv.id);

      const titleSpan = document.createElement('span');
      titleSpan.className = 'conv-title';
      titleSpan.innerHTML = `💬 ${escapeHtml(conv.title)}`;

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete-conv';
      delBtn.innerHTML = '🗑️';
      delBtn.title = 'Supprimer cette discussion et son dossier';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteConversationById(conv.id);
      };

      item.appendChild(titleSpan);
      item.appendChild(delBtn);
      container.appendChild(item);
    }
  }

  async function startNewConversation() {
    try {
      const res = await fetch('/api/conversations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: 'Nouvelle discussion' }),
      });
      if (!res.ok) return;
      const conv = await res.json();
      currentConversationId = conv.id;
      document.getElementById('active-chat-title').textContent = conv.title;
      document.getElementById('active-chat-badge').textContent = `conversations/${conv.folderName}/`;

      const chat = document.getElementById('chat');
      chat.innerHTML = '';
      addChatMsg("Nouvelle discussion démarrée. Les échanges, captures d'écran et réflexions seront archivés dans ce dossier.", 'system');

      await loadConversationsList();
      document.getElementById('instruction').focus();
    } catch (e) {
      addChatMsg(`❌ Impossible de créer la discussion : ${e.message}`, 'error');
    }
  }

  async function selectConversation(id) {
    if (busy) return;
    try {
      const res = await fetch(`/api/conversations/${encodeURIComponent(id)}`);
      if (!res.ok) return;
      const conv = await res.json();
      currentConversationId = conv.id;

      document.getElementById('active-chat-title').textContent = conv.title;
      document.getElementById('active-chat-badge').textContent = `conversations/${conv.folderName || conv.id}/`;

      const chat = document.getElementById('chat');
      chat.innerHTML = '';

      if (!conv.messages || conv.messages.length === 0) {
        addChatMsg("Discussion prête. Tape un premier ordre pour démarrer.", 'system');
      } else {
        for (const msg of conv.messages) {
          addChatMsg(msg.content, msg.role === 'assistant' ? 'agent' : msg.role);
        }
      }

      await loadConversationsList();
    } catch (e) {
      addChatMsg(`❌ Erreur lors du chargement : ${e.message}`, 'error');
    }
  }

  async function deleteConversationById(id) {
    if (!confirm('Supprimer cette discussion, ses fichiers txt et ses captures ?')) return;
    try {
      await fetch(`/api/conversations/${encodeURIComponent(id)}`, { method: 'DELETE' });
      if (currentConversationId === id) {
        currentConversationId = null;
      }
      await loadConversationsList();
    } catch (e) {
      alert(`Erreur suppression : ${e.message}`);
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // ── Polling intelligent (sans spam d'images) ───────────────────────────────
  async function pollStatus() {
    try {
      const res = await fetch('/api/status');
      if (res.status === 401) { location.href = '/login'; return; }
      const data = await res.json();
      updateStatus(data);
    } catch {
      setOffline();
    }
  }

  function updateStatus(data) {
    const dot = document.getElementById('status-dot');
    const lbl = document.getElementById('status-label');
    const dims = document.getElementById('screen-dims');

    busy = data.busy;
    dot.className = 'status-dot ' + (data.busy ? 'busy' : 'online');
    lbl.textContent = data.busy ? '⚙️ En cours…' : '✅ En attente';
    if (data.screenDimensions)
      dims.textContent = `${data.screenDimensions.width}×${data.screenDimensions.height}`;

    // Logs (avec filtrage des pings status)
    if (data.logs && data.logs.length > seenLogs) {
      const newLines = data.logs.slice(seenLogs);
      seenLogs = data.logs.length;
      appendLogs(newLines);
    }

    // Snapshot : UNIQUEMENT si un nouveau snapshot a été généré
    if (data.hasSnapshot && data.snapshotTime && data.snapshotTime > lastKnownSnapshotTime) {
      lastKnownSnapshotTime = data.snapshotTime;
      renderSnapshot(data.snapshotTime);
    }

    setSendDisabled(data.busy);
  }

  function renderSnapshot(ts) {
    const src = `/api/snapshot.png?t=${ts || Date.now()}`;
    const img = document.getElementById('snapshot-img');
    img.src = src;
    img.style.display = '';
    document.getElementById('snap-modal-img').src = src;
    const d = new Date(ts || Date.now());
    document.getElementById('snap-time').textContent = `Capturé à ${d.toLocaleTimeString('fr-FR')}`;
  }

  function refreshSnapshotManual() {
    renderSnapshot(Date.now());
  }

  function setOffline() {
    document.getElementById('status-dot').className = 'status-dot offline';
    document.getElementById('status-label').textContent = '❌ Agent hors ligne';
  }

  // ── Logs rendering ────────────────────────────────────────────────────────
  function appendLogs(lines) {
    const container = document.getElementById('logs');
    for (const line of lines) {
      // Ignorer les pings de statut silencieux
      if (/\/status/i.test(line)) continue;

      const div = document.createElement('div');
      div.className = 'log-line ' + classifyLog(line);
      div.textContent = line;
      container.appendChild(div);
    }
    container.scrollTop = container.scrollHeight;
  }

  function classifyLog(line) {
    if (/✅|PRÊT|DONE/i.test(line)) return 'ok';
    if (/❌|Erreur|ERROR|FAILED/i.test(line)) return 'err';
    if (/⚠️|SWAP|VRAM|MODÈLE/i.test(line)) return 'warn';
    if (/🧠|🛠️|📩|CYCLE|Stratège|Exécutant|720p/i.test(line)) return 'info';
    return '';
  }

  // ── Send command ──────────────────────────────────────────────────────────
  async function send() {
    const textarea = document.getElementById('instruction');
    const instruction = textarea.value.trim();
    if (!instruction || busy) return;

    addChatMsg(instruction, 'user');
    textarea.value = '';
    textarea.style.height = 'auto';
    setSendDisabled(true);

    const thinkingDiv = addChatMsg('<span class="spinner"></span>Réflexion & exécution en cours…', 'agent');

    try {
      const res = await fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          instruction,
          conversationId: currentConversationId,
        }),
      });
      if (res.status === 401) { location.href = '/login'; return; }

      const data = await res.json();
      thinkingDiv.remove();
      if (res.ok) {
        addChatMsg(data.result || '✅ Terminé.', 'agent');
        if (data.conversationId) {
          currentConversationId = data.conversationId;
        }
        await loadConversationsList();
        refreshSnapshotManual();
      } else {
        addChatMsg('❌ ' + (data.error || 'Erreur inconnue'), 'error');
      }
    } catch (err) {
      thinkingDiv.remove();
      addChatMsg('❌ Réseau : ' + err.message, 'error');
    } finally {
      setSendDisabled(false);
      pollStatus();
    }
  }

  function sendQuick(text) {
    const textarea = document.getElementById('instruction');
    textarea.value = text;
    send();
  }

  // ── Chat helpers ──────────────────────────────────────────────────────────
  function addChatMsg(html, type) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function setSendDisabled(val) {
    const btn = document.getElementById('send-btn');
    btn.disabled = val;
    btn.textContent = val ? 'En cours…' : 'Envoyer';
  }

  // ── Snapshot modal ──
  function openSnap() {
    document.getElementById('snap-modal').classList.add('open');
  }
  function closeSnap() {
    document.getElementById('snap-modal').classList.remove('open');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSnap(); });

  // ── Dynamic loop (interval adapté) ─────────────────────────────────────────
  async function runPollingLoop() {
    await pollStatus();
    setTimeout(runPollingLoop, busy ? 1500 : 4000);
  }

  loadModels();
  loadConversationsList();
  runPollingLoop();
</script>
</body>
</html>
